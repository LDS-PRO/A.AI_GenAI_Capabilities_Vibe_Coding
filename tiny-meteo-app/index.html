<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Meteo - Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Tiny Meteo</h1>
            <p class="subtitle">Your minimalist weather companion</p>
        </header>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
            <button id="searchBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </button>
        </div>
        
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
        </div>
        
        <div id="weatherData" class="weather-data hidden">
            <div class="location-info">
                <h2 id="cityName"></h2>
                <p id="country"></p>
            </div>
            
            <div class="current-weather">
                <div class="temperature">
                    <span id="temp"></span>°C
                </div>
                <div class="weather-icon">
                    <img id="weatherIcon" src="" alt="Weather icon">
                </div>
            </div>
            
            <div class="weather-description">
                <p id="description"></p>
            </div>
            
            <div class="weather-details">
                <div class="detail-item">
                    <span class="label">Feels like</span>
                    <span id="feelsLike" class="value"></span>
                </div>
                <div class="detail-item">
                    <span class="label">Humidity</span>
                    <span id="humidity" class="value"></span>
                </div>
                <div class="detail-item">
                    <span class="label">Wind Speed</span>
                    <span id="windSpeed" class="value"></span>
                </div>
                <div class="detail-item">
                    <span class="label">UV Index</span>
                    <span id="uvIndex" class="value"></span>
                </div>
            </div>
            
            <div class="last-updated">
                <p>Last updated: <span id="lastUpdated"></span></p>
            </div>
        </div>
        
        <div id="error" class="error hidden">
            <p id="errorMessage"></p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
